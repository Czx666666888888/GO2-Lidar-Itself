science_target_approach:
  ros__parameters:
    dry_run: true
    allow_odom: true
    stop_reference: camera_origin
    camera_frame: camera_link
    stop_xy_tolerance: 0.10
    anchor_window_sec: 2.0
    anchor_min_observations: 5
    anchor_max_spread: 0.08
    anchor_association_radius: 0.20
    anchor_alpha: 0.15
    require_recording: true
    map_frame: map
    distance_tolerance: 0.03
    kp_linear: 1.0
    kp_angular: 0.8
    align_yaw_threshold: 0.15
    max_acceleration: 0.15
    max_deceleration: 0.30
    max_linear_speed: 0.30
    max_angular_speed: 0.30
    control_rate_hz: 10.0
    lock_stability_sec: 3.0
    visual_timeout: 0.5
    odom_timeout: 0.4
    feedback_timeout: 0.5
    target_jump_m: 0.15
    localization_jump_m: 0.3
    localization_max_speed: 0.8
    localization_max_yaw_rate: 1.0
    max_target_range: 5.0
    speed_window_sec: 0.5
    braking_latency: 0.5
    max_run_time: 45.0
    odom_max_time: 25.0
    odom_max_distance: 2.0
    future_tolerance: 0.15
