# Optional overlay AFTER existing approach/search profiles. Ordinary MAP mode unchanged.
science_target_approach:
  ros__parameters:
    grasp_docking_enabled: true
    dock_s1_base_x: -0.06  # User-measured 0.36m behind nominal lidar +0.30m.
    dock_s1_base_y: 0.0
    dock_target_s1_x: 0.0
    dock_target_s1_y: 0.41  # Additional 0.10m clearance from right-side target.
    dock_min_linear_speed: 0.20  # Far approach only; fine control/braking take priority.
    dock_fine_distance: 0.15
    dock_fine_min_linear_speed: 0.18  # Braking/measured-speed/slew limits still take priority.
    dock_fine_max_linear_speed: 0.30  # Remove the previous 0.08 cap; retain overall cap.
    dock_settle_exit_tolerance: 0.08  # Zero hold outer band; success remains <=0.06m.
    dock_settle_wait_sec: 2.0  # Replan only after persistent failure to enter <=0.06m.
    dock_forward_step_enabled: true  # User-approved estimated trial; real stop checks remain.
    forward_step_profile_file: 'forward_step_estimated_trial.json'
    dock_allow_estimated_forward_profile: true  # Explicit user request; not measured calibration.
    dock_forward_deadzone_guard: true
    dock_forward_effective_speed: 0.20  # User confirmed .15 ineffective, .20 stable.
    dock_motion_window_sec: 0.5
    dock_motion_noise_m: 0.02
    dock_stable_window_sec: 0.5
    dock_settle_exit_confirm_sec: 0.3
    dock_visual_loss_stop_sec: 3.0
    dock_position_tolerance: 0.06  # User-approved 2026-11-14: accept 4-6cm, not arm reachability.
    dock_yaw_tolerance: 0.17453292519943295  # 10 degrees.
    dock_settled_sec: 0.5
    dock_progress_timeout: 10.0  # Compatibility only; progress no longer triggers a stop.
    dock_region_x_min: -0.05
    dock_region_x_max: 0.05
    dock_region_y_min: 0.29
    dock_region_y_max: 0.33
