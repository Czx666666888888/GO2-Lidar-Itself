# Optional overlay AFTER existing approach/search profiles. Ordinary MAP mode unchanged.
science_target_approach:
  ros__parameters:
    grasp_docking_enabled: true
    dock_s1_base_x: -0.06  # User-measured 0.36m behind nominal lidar +0.30m.
    dock_s1_base_y: 0.0
    dock_target_s1_x: 0.0
    dock_target_s1_y: 0.41  # Additional 0.10m clearance from right-side target.
    dock_min_linear_speed: 0.20  # Far approach only; fine control/braking take priority.
    dock_fine_distance: 0.15
    dock_fine_max_linear_speed: 0.08
    dock_settle_exit_tolerance: 0.06  # Resume correction; completion still requires 0.04m.
    dock_settle_wait_sec: 2.0  # Resume fine correction if still outside 0.04m after waiting.
    dock_position_tolerance: 0.04  # Navigation tolerance, not guaranteed arm reachability.
    dock_yaw_tolerance: 0.17453292519943295  # 10 degrees.
    dock_settled_sec: 0.5
    dock_progress_timeout: 10.0  # Compatibility only; progress no longer triggers a stop.
    dock_region_x_min: -0.05
    dock_region_x_max: 0.05
    dock_region_y_min: 0.29
    dock_region_y_max: 0.33
