# All paths are relative to this file, except official model names.
project: blue_cube
data: ../datasets/blue_cube/data.yaml
model: yolo11n.pt
output: ../runs
name: baseline_v1
imgsz: 640
epochs: 100
batch: 8
device: 0
patience: 20
workers: 4
seed: 42
augmentation:
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.4
  degrees: 5.0
  translate: 0.1
  scale: 0.3
  fliplr: 0.5
  flipud: 0.0
  mosaic: 0.5
  mixup: 0.0
  close_mosaic: 10
